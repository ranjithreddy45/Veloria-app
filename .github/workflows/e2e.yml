name: E2E smoke (Playwright)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veloria
          POSTGRES_PASSWORD: veloria_secret
          POSTGRES_DB: veloria_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veloria -d veloria_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://veloria:veloria_secret@localhost:5432/veloria_db
      # Dummy signing secret — CI only. auth.ts sets trustHost: true.
      AUTH_SECRET: e2e-ci-dummy-secret-0123456789abcdefghijklmnopqrstuvwxyz
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      E2E_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (postinstall runs prisma generate)
        run: pnpm install --frozen-lockfile

      # `next build` ignores type errors (next.config.ts), so this is the only
      # check that the design-system files type-check: the Record<Hue, …> maps,
      # the verb-only ActionLabel, component props. It is scoped to the files
      # that work touched (tsconfig.ui-check.json) because a full-project tsc
      # still fails on older errors elsewhere. Non-blocking for its first run;
      # remove `continue-on-error` once it is green on main.
      - name: Typecheck the design-system files (scoped)
        continue-on-error: true
        run: NODE_OPTIONS=--max-old-space-size=4096 ./node_modules/.bin/tsc -p tsconfig.ui-check.json

      - name: Push schema to the service database
        run: pnpm exec prisma db push --skip-generate

      - name: Seed (creates admin@veloriagrand.com / Admin@123)
        run: pnpm db:seed

      - name: Build
        run: pnpm build

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e suite (Playwright boots `pnpm start`)
        run: pnpm exec playwright test
        env:
          E2E_USE_WEBSERVER: "1"

      # The visual tour saves a screenshot of a spread of team screens in light,
      # dark and phone width. Uploaded on EVERY run, pass or fail: it is how a
      # restyle gets looked at by a person, since nobody can run the app locally
      # without a database.
      - name: Upload visual tour screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-tour
          path: tests/e2e/visual-tour-shots
          retention-days: 14
          if-no-files-found: ignore

      # Failure evidence: the trace, screenshot and video of every failed
      # attempt (playwright.config.ts keeps them: trace and video
      # retain-on-failure, screenshot only-on-failure), plus the HTML report
      # with the specs' JSON attachments. Uploaded on every run, not only a red
      # one: a flaky test fails its first attempt and passes on retry, the job
      # goes green, and that first attempt's trace is the only record of why.
      # Both folders are hidden, and upload-artifact skips hidden files unless
      # include-hidden-files is set; without it this step uploaded nothing
      # ("No files were found with the provided path").
      - name: Upload Playwright failure evidence (traces, screenshots, video, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            tests/e2e/.results
            tests/e2e/.report
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
