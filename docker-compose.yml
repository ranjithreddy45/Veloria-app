version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: veloria-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: veloria
      POSTGRES_PASSWORD: veloria_secret
      POSTGRES_DB: veloria_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: veloria-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
